name: deploy

# A completed CI does not automatically authorize a production deployment.
# Production must be explicitly enabled via the repository variable
# ENABLE_SNOWFLAKE_DEPLOY=true, and the GitHub production environment must
# be configured with approval rules and restricted credentials first.
on:
  workflow_run:
    workflows: ["dbt tests"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: playerpulse-snowflake-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Controlled dbt release
    if: >-
      ${{
        vars.ENABLE_SNOWFLAKE_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: snowflake-production
    steps:
      - name: Checkout the exact commit validated by CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install pinned dbt adapter
        run: python -m pip install --disable-pip-version-check -r requirements-dbt-ci.txt
      - name: Build models and run tests in protected environment
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: dbt build --project-dir dbt --profiles-dir .github/cd-profiles --target prod
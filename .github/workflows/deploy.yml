# .github/workflows/dbt-deploy.yml — fichier séparé, comme tu le voulais
name: dbt deploy

on:
  workflow_run:
    workflows: ["dbt tests"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'}}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v11d5960a326750d5838078e36cf38b85af677262
        with: 
          ref: ${{github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@va26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Install dbt
        run: pip install dbt-snowflake
      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          playerpulse:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                password: ${SNOWFLAKE_PASSWORD}
                database: PLAYERPULSE
                warehouse: PLAYERPULSE_WH
                schema: RAW
                threads: 4
          EOF
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      - name: Run dbt build
        working-directory: ./dbt
        run: dbt build
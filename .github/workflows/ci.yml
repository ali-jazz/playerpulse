name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playerpulse-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python lint and unit tests (no cloud)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false
      - name: Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install Python test tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Compile Python source (syntax check)
        run: python -m compileall -q scripts
      - name: Ruff critical checks
        run: ruff check scripts tests --select E4,E7,E9,F
      - name: Run unit tests
        run: python -m pytest tests/ -v

  dbt-offline:
    name: dbt parse (no Snowflake connection)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SNOWFLAKE_ACCOUNT: offline-placeholder
      SNOWFLAKE_USER: offline-placeholder
      SNOWFLAKE_PASSWORD: offline-placeholder
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install pinned dbt adapter
        run: python -m pip install --disable-pip-version-check -r requirements-dbt-ci.txt
      - name: Parse dbt project offline
        run: dbt parse --project-dir dbt --profiles-dir .github/ci-profiles --target ci --no-partial-parse
